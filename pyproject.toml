[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gnn-molecular"
version = "0.1.0"
description = "GCN, MPNN and DCNN graph neural networks for molecular solubility (ESOL)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "rdkit>=2023.9",
  "torch>=2.2",
  "torch-geometric>=2.5",
]

[project.scripts]
mgnn-train = "mgnn.train:main"
mgnn-predict = "mgnn.predict:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/mgnn"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
